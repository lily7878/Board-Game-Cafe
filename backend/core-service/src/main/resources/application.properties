spring.application.name=core-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/board_game_cafe
spring.datasource.username=bgc_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Server
server.port=8082

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Temporary configurable limit until CafeSettings is implemented.
app.game-requests.max-delivered-per-session=3
