spring.application.name=core-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/board_game_cafe
spring.datasource.username=bgc_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Server
server.port=8082

# Internal AI Service (backend/ai-service). Empty token = AI off, recommendations use the fallback.
bgc.ai.base-url=http://127.0.0.1:8081
bgc.ai.internal-token=${BGC_AI_INTERNAL_TOKEN:}
bgc.ai.connect-timeout=2s
bgc.ai.recommendations-timeout=8s

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
