spring.application.name=core-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/board_game_cafe
spring.datasource.username=bgc_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Server
server.port=8082

# Internal AI Service (backend/ai-service). Empty token = AI off, recommendations use the fallback.
bgc.ai.base-url=http://127.0.0.1:8081
bgc.ai.internal-token=${BGC_AI_INTERNAL_TOKEN:}
bgc.ai.connect-timeout=2s
# gemma2:9b on a laptop GPU needs ~15-30 s for 15 games; after this the labelled fallback is returned.
bgc.ai.recommendations-timeout=45s
# Rules answers (search + answer with citations) and PDF hand-over to the AI Service.
bgc.ai.rules-timeout=70s

# PDF rule manuals: stored outside the repository; Core polls the AI Service while they are processed.
bgc.rules.storage-dir=${BGC_RULES_DIR:${user.home}/.bgc-local/rule-pdfs}
bgc.rules.poll-interval=5s
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
