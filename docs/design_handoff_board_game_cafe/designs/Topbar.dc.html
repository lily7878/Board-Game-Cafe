<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:76px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 36px;border-bottom:1px solid rgba(73,56,47,0.08);font-family:Manrope,system-ui,sans-serif;color:#49382F">
  <div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-right:auto">{{ title }}</div>
  <div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:#FFFFFF;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(73,56,47,0.06)"><span style="width:16px;height:16px;background:#925E68;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/calendar-days.svg) center/contain no-repeat"></span><span style="font-weight:800">Ziua #14</span><span style="color:#7A6A60">deschisă</span></div>
  <div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#E4EEDF;color:#3E5A37;font-size:13px;font-weight:700"><span style="width:8px;height:8px;border-radius:999px;background:#5F8A55"></span>Live</div>
  <div style="position:relative;width:40px;height:40px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(73,56,47,0.06);cursor:pointer"><span style="width:18px;height:18px;background:#49382F;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/bell.svg) center/contain no-repeat"></span><sc-if value="{{ hasNotif }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#925E68;color:#FFFFFF;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #F7F1E9">{{ notif }}</span></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1192,&quot;height&quot;:76},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;notif&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() { const n = Number(this.props.notif ?? 3);
    return { title: this.props.title ?? 'Dashboard', notif: n, hasNotif: n > 0 }; }
}
</script>
</body>
</html>
