<html>
<head>
<meta charset="utf-8">

<body>
<x-dc>
<div style="width:248px;height:100%;box-sizing:border-box;background:#49382F;color:#EADFD6;display:flex;flex-direction:column;gap:22px;padding:24px 16px;font-family:Manrope,system-ui,sans-serif">

  </div>

    <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B9A89C;padding:0 14px 6px">Operațiuni</div>
    <sc-if value="{{ a_dashboard }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/layout-dashboard.svg) center/contain no-repeat"></span>Dashboard</div></sc-if>
    <sc-if value="{{ n_dashboard }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/layout-dashboard.svg) center/contain no-repeat"></span>Dashboard</div></sc-if>
    <sc-if value="{{ a_tables }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/armchair.svg) center/contain no-repeat"></span>Mese</div></sc-if>
    <sc-if value="{{ n_tables }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/armchair.svg) center/contain no-repeat"></span>Mese</div></sc-if>
    <sc-if value="{{ a_orders }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/clipboard-list.svg) center/contain no-repeat"></span>Comenzi<span style="margin-left:auto;min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#925E68;color:#FFFFFF;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">4</span></div></sc-if>
    <sc-if value="{{ n_orders }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/clipboard-list.svg) center/contain no-repeat"></span>Comenzi<span style="margin-left:auto;min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#B7848C;color:#2E211B;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">4</span></div></sc-if>
    <sc-if value="{{ a_requests }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/dices.svg) center/contain no-repeat"></span>Cereri jocuri<span style="margin-left:auto;min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#925E68;color:#FFFFFF;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">3</span></div></sc-if>
    <sc-if value="{{ n_requests }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/dices.svg) center/contain no-repeat"></span>Cereri jocuri<span style="margin-left:auto;min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#B7848C;color:#2E211B;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">3</span></div></sc-if>
  </div>
  <sc-if value="{{ isManager }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:4px">
    <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B9A89C;padding:0 14px 6px">Administrare</div>
    <sc-if value="{{ a_admin }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/layout-grid.svg) center/contain no-repeat"></span>Toate modulele</div></sc-if>
    <sc-if value="{{ n_admin }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/layout-grid.svg) center/contain no-repeat"></span>Toate modulele</div></sc-if>
    <sc-if value="{{ a_staff }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/users.svg) center/contain no-repeat"></span>Personal</div></sc-if>
    <sc-if value="{{ n_staff }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/users.svg) center/contain no-repeat"></span>Personal</div></sc-if>
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/table-2.svg) center/contain no-repeat"></span>Configurare mese</div>
    <sc-if value="{{ a_games }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/puzzle.svg) center/contain no-repeat"></span>Jocuri</div></sc-if>
    <sc-if value="{{ n_games }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/puzzle.svg) center/contain no-repeat"></span>Jocuri</div></sc-if>
    <sc-if value="{{ a_menu }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/coffee.svg) center/contain no-repeat"></span>Meniu</div></sc-if>
    <sc-if value="{{ n_menu }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/coffee.svg) center/contain no-repeat"></span>Meniu</div></sc-if>
    <sc-if value="{{ a_settings }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/settings.svg) center/contain no-repeat"></span>Setări</div></sc-if>
    <sc-if value="{{ n_settings }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/settings.svg) center/contain no-repeat"></span>Setări</div></sc-if>
    <sc-if value="{{ a_reports }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:700;background:#EAD6D8;color:#49382F"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/trending-up.svg) center/contain no-repeat"></span>Rapoarte</div></sc-if>
    <sc-if value="{{ n_reports }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,0.07)"><span style="width:18px;height:18px;flex:none;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/trending-up.svg) center/contain no-repeat"></span>Rapoarte</div></sc-if>
  </div>
  </sc-if>
  <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:999px;background:rgba(255,255,255,0.06)">
    <div style="width:36px;height:36px;border-radius:999px;background:#B7848C;color:#2E211B;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">{{ initials }}</div>
    <div style="display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1"><span style="font-size:13px;font-weight:700;color:#F7F1E9">{{ userName }}</span><span style="font-size:11px;font-weight:600;color:#B9A89C">{{ roleLabel }}</span></div>
    <div style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#B9A89C;cursor:pointer" style-hover="background:rgba(255,255,255,0.08);color:#F7F1E9"><span style="width:16px;height:16px;background:currentColor;mask:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/log-out.svg) center/contain no-repeat"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;tables&quot;,&quot;orders&quot;,&quot;requests&quot;,&quot;admin&quot;,&quot;staff&quot;,&quot;games&quot;,&quot;menu&quot;,&quot;settings&quot;,&quot;reports&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;staff&quot;,&quot;manager&quot;],&quot;default&quot;:&quot;staff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Andrei Pop&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dashboard';
    const v = {};
    ['dashboard', 'tables', 'orders', 'requests', 'admin', 'staff', 'games', 'menu', 'settings', 'reports'].forEach(k => { v['a_' + k] = a === k; v['n_' + k] = a !== k; });
    const mgr = (this.props.role ?? 'staff') === 'manager';
    const name = this.props.userName ?? (mgr ? 'Ioana Ionescu' : 'Andrei Pop');
    return { ...v, isManager: mgr, userName: name, initials: name.split(' ').map(s => s[0]).join(''), roleLabel: mgr ? 'Manager' : 'Staff' };
  }
}
</script>
</body>
</html>
